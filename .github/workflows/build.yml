name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -q package

      - name: Version lesen
        id: v
        run: echo "version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: MissileWars-${{ steps.v.outputs.version }}
          path: target/MissileWars-*.jar

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: MissileWars ${{ steps.v.outputs.version }} (Paper 26.3)
          make_latest: true
          files: target/MissileWars-*.jar
          body: |
            Missile Wars für **Paper 26.3** (Java 21+).
            JAR in `plugins/` legen, Server starten, ingame `/mw join` – die Standard-Arena wird automatisch generiert.
            Neu in 2.6: Mehrere Lobbys (Standard 2) mit Auto-Zuteilung, Start per Bereit ab 2 Spielern / 60-s-Timer ab 4, synchroner Timer (Bossbar, XP, Scoreboard), AFK nur als Hinweis nach 5 min, Join-/Leave-Nachrichten, Performance-Optimierungen.
            Neu in 2.5: Raketen explodieren zuverlässig und gehen nicht mehr durch Wände, Start nur per Bereit (60 s = AFK-Check), Glasdicke-Abstimmung (15/24/32), 4 neue Themen-Maps (Dschungel, Wüste, Atlantis, Burg), neue GUIs, fairere Preise & begrenzte Teil-Reparaturen.
            Neu in 2.4: 5 Arena-Themes (Klassisch, Piraten, Raumschiffe, Eis, Nether), mehr Schutzglas, Schleich-Platzierung, Bereit-Pflicht, neue Lobby-Hotbar & Scoreboard, Team-Upgrades, Leistungsbewertung, End-Animation.
            Eigene Maps: `/mw map create <name> arena` bzw. `/mw map import <name> <welt>` (siehe README).
