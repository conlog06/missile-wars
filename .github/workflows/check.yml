name: Check (Branches)

on:
  push:
    branches: [ 'claude/**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Kompilieren
        run: |
          set -o pipefail
          mvn -B -ntp package 2>&1 | tee build.log
      - name: Fehler anzeigen
        if: failure()
        run: grep -E "\[ERROR\]|error:" build.log | head -60
      - uses: actions/upload-artifact@v5
        with:
          name: build
          path: '**/target/*.jar'
