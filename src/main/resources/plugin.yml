name: MissileWars
version: ${project.version}
main: de.crafterteam.missilewars.MissileWarsPlugin
api-version: '26.3'
author: Constantin
softdepend: [LuckPerms]
# MySQL-Treiber wird von Paper beim ersten Start automatisch geladen (nur für storage.type: mysql nötig)
libraries:
  - com.mysql:mysql-connector-j:9.1.0
description: Missile Wars für Paper 26.3 – Raketen, Schilde, Feuerbälle, generierte & eigene Maps
permissions:
  missilewars.play:
    description: Missile Wars spielen
    default: true
  missilewars.admin:
    description: Maps einrichten, Runden starten/stoppen
    default: op
    children:
      missilewars.mod: true
      missilewars.start: true
  missilewars.mod:
    description: Mod-Modus (/mw mod) – unsichtbar, Spieler einfrieren/verschieben, Runde starten
    default: op
  missilewars.start:
    description: VIP/Premium – Start-Block in der Wartelobby, /mw start
    default: op
  missilewars.vip:
    description: VIP – mehr Coins (vip.coin-multiplier) und doppelte Tagesbelohnung
    default: false
