# ─────────────────────────────────────────────
#  MissileWars – Konfiguration
# ─────────────────────────────────────────────

config-version: 3

# ── Einzelspiel ─────────────────────────────────────────────────
# Es gibt immer nur EINE Runde. Spieler kommen beim Joinen automatisch rein,
# die Map wird in der Wartelobby per Abstimmung gewählt (kein /mw join nötig).
single-game:
  enabled: true
  auto-join: true         # beim Betreten des Servers direkt in die Runde
  start-map: random       # random oder Mapname – Startwert vor der Abstimmung

# ── Spielmodus-Server (Auto-Join) ───────────────────────────────
# Für einen reinen MissileWars-Server hinter BungeeCord/Velocity:
# Spieler landen beim Joinen automatisch in einer Runde.
server-mode:
  enabled: false
  map: ''                 # leer = default-map / Abstimmung
  after-game: requeue     # requeue = direkt nächste Runde, lobby-server = zurück auf den Lobby-Server
  motd: true              # Rundenstatus in der Serverliste (für Server-Selector)

# ── BungeeCord / Velocity ───────────────────────────────────────
bungee:
  enabled: false
  lobby-server: lobby     # Servername aus der Proxy-Config ("Verlassen" schickt dorthin)

# ── Wartelobby ──────────────────────────────────────────────────
waiting-lobby:
  enabled: true
  location: ''            # leer = generierte Lobby-Insel, sonst /mw setwaitlobby

# ── Nametags & Tab-Liste (LuckPerms-Präfixe, falls installiert) ─
nametags:
  enabled: true
tablist:
  enabled: true
  server-name: ''         # z. B. "play.deinserver.de" im Tab-Footer

killstreaks:
  enabled: true           # 3/5/7/10 Kills in Folge: Ansage + Bonus-Items

respawn-delay: 3          # Sekunden als Zuschauer nach dem Tod (0 = sofort)
time-limit-minutes: 15    # danach gewinnt das Team mit dem intakteren Portal (0 = aus)
afk-seconds: 90           # AFK-Spieler werden zu Zuschauern (0 = aus)
kits: true                # Kit-Auswahl in der Wartelobby
lobby-double-jump: true   # Doppelsprung in der Wartelobby
team-compass: true        # Kompass zeigt auf das gegnerische Portal

# Wohin Spieler nach der Runde kommen. Mit /mw setlobby setzen.
# Leer = zurück an den Ort, von dem sie /mw join gemacht haben.
lobby: ''

# Map, die /mw join ohne Angabe nimmt
default-map: standard

players:
  min: 2            # ab so vielen Spielern startet der Countdown
  max: 16
  allow-late-join: true   # während der Runde noch einem Team beitreten

countdown:
  normal: 20
  full: 10          # wenn die Runde voll ist

# Alle X Sekunden bekommt jeder Spieler ein zufälliges Item
item-interval: 20
start-items: 1      # Items direkt beim Start
start-arrows: 3

end-delay: 8        # Sekunden nach dem Sieg, bis alle zurück in die Lobby kommen

auto-balance: true  # Teams beim Start ausgleichen (max. 1 Spieler Unterschied)
team-chat: true     # Chat im Spiel nur fürs eigene Team, "@Nachricht" an alle

sudden-death:
  after-minutes: 8  # 0 = aus
  item-factor: 0.5  # Item-Intervall wird damit multipliziert

warning:
  distance: 20      # Verteidiger warnen, wenn eine Rakete so nah am Portal ist (0 = aus)

voting:
  enabled: true     # Map-Abstimmung in der Wartephase (Karte im Inventar, /mw vote)
  end-at: 10        # bei so vielen Sekunden Countdown wird ausgewertet

# Team-Auswahl: dialog (nativer Dialog, ab 1.21.6) oder inventory (für alte Clients via ViaBackwards)
# Schleichen + Rechtsklick auf die Wolle öffnet immer das Inventar-Menü.
menu-style: dialog

# Abklingzeit nach Benutzung eines Items (Vanilla-Cooldown-Anzeige), 0 = aus
item-cooldown-ticks: 20

combat:
  old-pvp: false    # true = kein Angriffs-Cooldown (1.8-Feeling)

portal:
  # 0 = klassisch: ein zerstörter Portalblock = Niederlage
  # z. B. 30 = Portal hat HP, verloren bei 30 % zerstörten Blöcken (Anzeige über Hologramm & Sidebar)
  loss-percent: 0

missile:
  preview: true           # leuchtende Vorschau beim Halten einer Rakete
  fuse-ticks: 60          # Zündzeit der TNT nach dem Aufprall (Vanilla-Redstone: 80)
  max-steps: 260          # danach bleibt die Rakete einfach stehen
  pierce-glass-max: 12    # Shieldbuster: so viele Glasblöcke durchbricht er
  own-half-only: true     # Raketen nur auf der eigenen Hälfte spawnen
  max-active-per-team: 15 # gleichzeitig fliegende Raketen pro Team (0 = unbegrenzt)
  # Ticks pro Block (kleiner = schneller)
  speed:
    tomahawk: 4
    juggernaut: 6
    shieldbuster: 4
    lightning: 2
    guardian: 5
    gemini: 4
    interceptor: 2
    hydra: 4
    drill: 5
    arrow: 1
    carrier: 4
    cluster: 4

shield:
  radius: 3
  deploy-ticks: 20        # nach so vielen Ticks klappt der Schild auf

fireball:
  yield: 2.0

# Item-Pool: weight = Wahrscheinlichkeit, max = höchstens so viele im Inventar
items:
  tomahawk:     { weight: 10, max: 2 }
  juggernaut:   { weight: 6,  max: 1 }
  shieldbuster: { weight: 6,  max: 1 }
  lightning:    { weight: 8,  max: 2 }
  guardian:     { weight: 6,  max: 1 }
  gemini:       { weight: 6,  max: 1 }
  interceptor:  { weight: 7,  max: 2 }
  hydra:        { weight: 5,  max: 1 }
  drill:        { weight: 5,  max: 1 }
  arrow:        { weight: 7,  max: 2 }
  carrier:      { weight: 4,  max: 1 }
  cluster:      { weight: 5,  max: 1 }
  platform:     { weight: 4,  max: 1 }               # Rettungsplattform gegen Void-Tode
  enderpearl:   { weight: 3,  max: 1 }
  shield:       { weight: 8,  max: 2 }
  fireball:     { weight: 6,  max: 2 }
  arrows:       { weight: 8,  max: 9, amount: 3 }
  windcharge:   { weight: 6,  max: 4, amount: 2 }   # Windkugel (1.21): Sprünge, Gegner wegschleudern
  mace:         { weight: 0,  max: 1 }              # Streitkolben (1.21) – standardmäßig aus

# Standard-Arena (generiert)
generator:
  distance: 60      # Abstand Mitte → Portal (Gesamtlänge = 2x)

# Diese Blöcke dürfen Spieler im Spiel abbauen (Raketen entschärfen, Schilde zerstören)
breakable:
  - SLIME_BLOCK
  - HONEY_BLOCK
  - PISTON
  - STICKY_PISTON
  - PISTON_HEAD
  - MOVING_PISTON
  - OBSERVER
  - TNT
  - REDSTONE_BLOCK
  - LIME_STAINED_GLASS
  - RED_STAINED_GLASS
  - WHITE_STAINED_GLASS
  - GLASS
